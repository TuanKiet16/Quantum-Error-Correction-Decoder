[project]
name = "quantum-error-correction-decoder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "stim>=1.13",
    "pymatching>=2.2",
    "numpy>=1.26",
    "pennylane>=0.38",
    "pennylane-lightning>=0.38",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["qec_decoder*"]
